# Everything runs on one host. There is no cloud dependency, no frontend, and nothing to
# keep warm: Bifrost, the Okta plugin, and the Fleet Ops MCP server sit side by side and
# you drive the whole thing from a terminal.
#
#   cp .env.example .env      # then fill it in from your tenant
#   make up                   # build the plugin, render the config, start everything
#
# The plugin .so is built by the plugin repo's Makefile and mounted in read-only. It is
# not baked into an image, so you can rebuild it against a different Bifrost version
# without touching anything here.

services:
  fleetops:
    build:
      context: ./server
    environment:
      # The server validates tokens itself rather than trusting the gateway. If the
      # gateway were the only thing checking, bypassing the gateway would bypass
      # authorization entirely.
      FLEETOPS_ISSUERS: ${FLEETOPS_ISSUERS:?set FLEETOPS_ISSUERS in .env}
      FLEETOPS_AUDIENCES: ${FLEETOPS_AUDIENCES:?set FLEETOPS_AUDIENCES in .env}
      FLEETOPS_ADDR: ":8080"
      # Only used on networks that intercept TLS. Empty means the image's own trust
      # store, which is what you want everywhere else. See certs/README.md.
      #
      # Driven by EXTRA_CA_BUNDLE rather than SSL_CERT_FILE on purpose. Compose gives the
      # host shell precedence over .env, and SSL_CERT_FILE is often already exported on a
      # developer machine, which would silently override this with a host path that does
      # not exist inside the container. The symptom is an unknown-authority TLS error that
      # looks exactly like having set nothing at all.
      SSL_CERT_FILE: ${EXTRA_CA_BUNDLE:-}
    volumes:
      - ./certs:/certs:ro
    expose:
      - "8080"
    restart: unless-stopped

  bifrost:
    image: ${BIFROST_IMAGE:-maximhq/bifrost:latest}
    environment:
      # The plugin calls Okta over HTTPS from inside this container, so if your network
      # re-signs TLS this must point at a bundle containing that root. See certs/README.md.
      # EXTRA_CA_BUNDLE rather than SSL_CERT_FILE for the reason given on the service above.
      SSL_CERT_FILE: ${EXTRA_CA_BUNDLE:-}
    depends_on:
      fleetops:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      # Must be $APP_DIR/config.json, and APP_DIR defaults to /app/data. Mounting it
      # anywhere else means Bifrost silently starts with defaults and your plugin never
      # loads: the only hint is one info line saying the config file was not found.
      - ./bifrost/config.json:/app/data/config.json:ro
      # Built by the plugin repo: make plugin PLATFORM=linux/amd64
      - ../okta-bifrost-plugin/bin:/etc/bifrost/plugins:ro
      - bifrost-data:/app/data
      - ./certs:/certs:ro
      # The agent's private key, read directly by the plugin. Kept out of the config so
      # the config is not itself a secret. See secrets/README.md.
      - ./secrets:/secrets:ro
    restart: unless-stopped

volumes:
  bifrost-data:
